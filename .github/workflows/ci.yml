name: CI

# Runs the full verification (type check, lint, unit tests, production build,
# browser tests) on every push and pull request. No deployment here: Vercel
# deploys separately.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Use Playwright's own Chromium instead of an installed Google Chrome (see playwright.config.ts).
      PW_BUNDLED_CHROMIUM: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # typecheck → lint → unit tests → production build → browser tests (on the fresh build)
      - run: npm run test:all

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
